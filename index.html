<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Maze</title>
    <link rel="stylesheet" href="maze-styles/style.css?v=6">
</head>
<body class="in-menu">
    <div class="game-container">
        <h1>Maze For Maze</h1>
        <div class="game-layout">
            <div class="maze-wrapper" id="stage">
                <canvas id="maze" class="maze" aria-label="Maze"></canvas>
                <div class="mini-tile" id="miniTile"><canvas id="mini" title="Mini map – Click or drag to move the camera"></canvas></div>
                <div class="pad-wrap" id="padWrap">
                    <div class="pad-grip" id="padGrip" title="Drag to reposition"></div>
                    <div class="pad" id="pad" title="Drag to move the camera">
                        <div class="knob" id="knob"></div>
                    </div>
                </div>
                <div id="banner" class="banner"></div>
                <div id="winCard" class="win-card">
                    <div id="message" class="message"></div>
                    <div id="winStats" class="win-stats"></div>
                    <button onclick="newMaze()">New Maze</button>
                </div>
                <div id="menu" class="overlay">
                    <h2>Choose Mode</h2>
                    <p>Collect all the points</p>
                    <button class="opt" data-n="3">3 Point</button>
                    <button class="opt" data-n="6">6 Point</button>
                    <button class="opt" data-n="9">9 Point</button>
                </div>
                <div id="confirm" class="overlay">
                    <h2 id="confirmTitle">End current game?</h2>
                    <p id="confirmText">The game will stop and the shortest paths from the start to every point will be shown.</p>
                    <div class="btns">
                        <button id="endYes">End Game</button>
                        <button id="endNo" class="ghost">Continue</button>
                    </div>
                </div>
            </div>
            <aside class="panel" id="panel">
                <div class="tile hud">
                    <div><span class="lbl">Steps</span><b id="hudSteps">0</b></div>
                    <div><span class="lbl">Time</span><b id="hudTime">0:00</b></div>
                    <div><span class="lbl">Goals</span><b id="hudGoals">0/3</b></div>
                </div>
                <div class="tools">
                    <div class="grp">
                        <button class="btn sm" id="zoomOut" title="Zoom out  ( - )" aria-label="Zoom out">−</button>
                        <span class="zoom-label" id="zoomLabel">100%</span>
                        <button class="btn sm" id="zoomIn" title="Zoom in  ( + )" aria-label="Zoom in">+</button>
                    </div>
                    <div class="grp">
                        <button class="btn" id="zoomReset" title="Reset view  ( 0 )">Reset</button>
                        <button class="btn" id="followBtn" aria-pressed="true" title="Camera follows the player">Follow</button>
                    </div>
                    <div class="grp">
                        <button class="btn" id="fogBtn" aria-pressed="false" title="Torch">🔦 Torch</button>
                        <button class="btn" id="hintBtn" title="Hint">💡 Hint <span id="hintCount">3</span></button>
                    </div>
                    <button class="newbtn" onclick="newMaze()">New Maze</button>
                </div>
            </aside>
        </div>
    </div>
    <script src="maze-game/maze.js?v=6"></script>
</body>
</html>
