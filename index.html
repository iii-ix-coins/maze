<!doctype html>
<html lang="fa" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08130f" />
    <meta name="description" content="Hollld — Maze mining, token information and online maze races." />
    <meta name="maze-multiplayer-url" content="" />
    <title>Hollld.fun</title>
    <link rel="icon" type="image/x-icon" href="/css/images/maze-logo.svg" />
    <!-- Keep the original theme bootstrap before styles and React to avoid a theme flash. -->
    <!-- Synchronous theme preference initialization prevents a first-paint theme flash. -->
    <script>
      (() => {
        const allowedThemes = new Set(['grass', 'dark', 'light']);
        let theme = 'grass';
        try {
          const savedTheme = window.localStorage.getItem('hollld-theme');
          if (allowedThemes.has(savedTheme)) theme = savedTheme;
        } catch (_) {
          // Storage can be unavailable in privacy-restricted browser contexts.
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <!-- Shared, order-sensitive stylesheets are injected by vite.config.mts (SHARED_STYLES). Page-specific stylesheets follow. -->
    <!-- @shared-styles -->
    <link rel="stylesheet" href="/css/home-style.css" />
    <link rel="stylesheet" href="/css/feature-pages.css" />
    <!-- Keep the shared navigation above the Maze page surface. -->
    <style>
      body.in-menu #site-header { z-index: 1000; }
    </style>
  </head>
  <body class="page-loading">
    <script>
      if (window.location.pathname === '/maze.html') {
        document.body.classList.add('in-menu');
        document.title = 'Play Maze · Hollld';
      }
    </script>
    <!-- Both hosts stay direct body children; this preserves the legacy CSS selectors. -->
    <div id="root" style="display: contents"></div>
    <!-- React portal target: keeps the original body-level Maze placement without a second React root. -->
    <div id="maze-root" style="display: contents"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
